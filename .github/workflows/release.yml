name: Release

# On every push to main (i.e. after merging a release/* PR), tag the version and
# publish a GitHub Release. The version is the single source of truth in
# package.json (bumped by the "Prepare release" workflow); this workflow only
# reads it and creates the matching tag `v<version>` if it does not exist yet.
# Build/deploy to production is NOT here: the CI workflow (ci.yml) handles it on
# the same push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag and publish release (skip if the tag already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Never move an already-published tag: if it exists, this is a push to
          # main that did not bump the version, so there is nothing to release.
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; nothing to release."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
