name: Release

# On every push to main (i.e. after merging a release/* PR), tag the version and
# publish a GitHub Release. The version is the single source of truth in
# package.json (bumped by the "Prepare release" workflow); this workflow only
# reads it and creates the matching tag `v<version>` if it does not exist yet.
# Build/deploy to production is NOT here: the CI workflow (ci.yml) handles it on
# the same push to main.
#
# After a NEW tag is created, the sync-develop job opens a PR advancing develop
# to the next `-dev` version. It runs here (not in a separate tag-triggered
# workflow) because pushes made with GITHUB_TOKEN do not trigger downstream
# workflows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.tag.outputs.released }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag and publish release (skip if the tag already exists)
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          # Never move an already-published tag: if it exists, this is a push to
          # main that did not bump the version, so there is nothing to release.
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
          echo "released=true" >> "$GITHUB_OUTPUT"

  # Advance develop to the next in-development version after a release. develop
  # tracks the next minor with a `-dev` suffix (X.(Y+1).0-dev). This only edits
  # the version field on a branch cut from develop — no code from main is merged
  # into develop.
  sync-develop:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Open PR bumping develop to the next -dev version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASED: ${{ needs.release.outputs.version }}
        run: |
          # After releasing X.Y.Z the next in-development version is the next
          # minor with a `-dev` pre-release suffix: X.(Y+1).0-dev. A hotfix
          # (patch) resolves to the same minor develop already tracks, so the
          # guard below turns it into a no-op.
          NEXT=$(node -e "const [maj,min]=process.argv[1].split('.'); console.log(maj + '.' + (Number(min) + 1) + '.0-dev')" "$RELEASED")
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" = "$NEXT" ]; then
            echo "develop is already at $NEXT; nothing to sync."
            exit 0
          fi
          BRANCH="chore/next-dev-$NEXT"
          # Idempotency: if the branch already exists (PR still open), do nothing.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          npm version "$NEXT" --no-git-tag-version --allow-same-version
          git commit -am "chore(release): bump develop to $NEXT"
          git push origin "$BRANCH"
          gh pr create --base develop --head "$BRANCH" \
            --title "chore: bump develop to $NEXT" \
            --body "Automated follow-up to release v$RELEASED: advance develop to the next in-development version \`$NEXT\` (next minor + \`-dev\`). Only the version field changes — no code from main is merged into develop."
